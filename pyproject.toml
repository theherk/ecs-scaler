[project]
name = "ecs-scaler"
version = "1.3.0"
description = "Scale ECS services by environment, with include/exclude filtering"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adam Sherwood", email = "theherk@gmail.com" }]
dependencies = ["boto3"]

[project.scripts]
scale = "scale:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = ["scale.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
